name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.daemon=false"
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Organize APK Output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/V-Droid-Engine.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Droid-Engine-APK
          path: release-output/V-Droid-Engine.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: V-Droid Engine v1.0.0 (Latest APK)
          body: |
            ## 📱 V-Droid Engine APK Download
            
            Download `V-Droid-Engine.apk` below directly to your Android device to install!
            
            ### ⚡ Features:
            - **Android 9 (Pie)** Virtual Container Engine
            - **Pre-Rooted** with Magisk & SU binary access
            - **Multi-App Switching** & Dual Instance Support
            - **ARM64 / x86_64** Architecture Translation Engine
          files: release-output/V-Droid-Engine.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

